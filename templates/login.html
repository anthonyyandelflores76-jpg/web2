<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrador - TCI.STORE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f4f6f9;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h3 class="fw-bold text-center mb-4">Administrador</h3>
    
    {% if error %}
      <div class="alert alert-danger py-2 text-center small" role="alert">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST">
      <div class="mb-3">
        <label for="password" class="form-label text-muted small fw-bold">Contraseña</label>
        <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••••••">
      </div>
      <button type="submit" class="btn btn-dark w-100 rounded-pill py-2 fw-bold">Ingresar</button>
    </form>
    
    <div class="text-center mt-3">
      <a href="{{ url_for('index') }}" class="text-decoration-none text-muted small">← Volver a la tienda</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
