[build]
  command = "pip install -r requirements.txt"
  functions = "functions"

[build.environment]
  PYTHON_VERSION = "3.11"
  SECRETS_SCAN_ENABLED = "false"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/netlify_app"
  status = 200

[functions]
  node_bundler = "esbuild"
  included_files = ["templates/**", "static/**"]